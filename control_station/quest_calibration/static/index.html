<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quest 配对标定</title>
  <style>
    :root { color-scheme: light; --bg:#eef2f6; --panel:#fff; --text:#17202d; --muted:#657184; --accent:#147a74; --danger:#b42318; --border:#d7dee8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; color:var(--text); background:var(--bg); }
    main { max-width:980px; margin:auto; padding:24px; display:grid; gap:16px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
    h1,h2 { margin:0 0 12px; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    label { display:grid; gap:5px; color:var(--muted); font-size:13px; }
    input,select,button { min-height:42px; border:1px solid var(--border); border-radius:8px; padding:9px 11px; font:inherit; }
    button { cursor:pointer; background:#e8f5f3; }
    button.danger { background:#ffe9e9; color:var(--danger); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    pre { white-space:pre-wrap; word-break:break-word; background:#101826; color:#edf2f7; border-radius:8px; padding:12px; min-height:76px; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Quest × 机械臂配对标定</h1>
    <div class="muted">仅操作静止窗口采集；不发送机械臂动作，不接受标定，不安装坐标系。</div>
    <p>绑定状态：<strong id="bindingState">等待应用</strong></p>
    <p>采集状态：<strong id="captureState">-</strong>　已完成窗口：<strong id="completedCount">0</strong></p>
  </section>
  <section class="panel">
    <h2>1. 选择 Quest 手柄与机械臂侧</h2>
    <div class="grid">
      <label>候选手柄<select id="candidate"></select></label>
      <label>机械臂侧<select id="robotSide"><option value="right">right</option><option value="left">left</option></select></label>
      <label>Quest reference frame ID<input id="referenceFrame" value="quest-local-floor-generation-0"></label>
      <label>Controller grip frame ID<input id="movingFrame" value="quest-controller-grip"></label>
      <label>WebXR frame clock ID<input id="frameClock" value="webxr-frame-clock"></label>
    </div>
    <div class="actions"><button id="selectSource">选择并绑定</button></div>
  </section>
  <section class="panel">
    <h2>2. 静止窗口</h2>
    <label>窗口 ID<input id="windowId" value="stationary-window-001"></label>
    <div class="actions">
      <button id="beginWindow">开始窗口</button>
      <button id="completeWindow">完成窗口（自动排空）</button>
      <button id="seal">封存候选（当前仅内存）</button>
      <button class="danger" id="cancel">取消并关闭采集</button>
    </div>
    <div class="muted">完成后窗口 ID 自动递增；建议采集至少 15 个覆盖工作空间、绕两个以上非平行轴旋转的静止姿态。</div>
  </section>
  <section class="panel">
    <h2>脱敏状态</h2>
    <pre id="status">等待状态...</pre>
    <div class="muted">此页面不显示矩阵、原始 pose、事件流、证据数据集或拟合结果。</div>
    <div class="muted">测试结束后请回到启动终端按 Ctrl+C，完成整个会话的有序关闭。</div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
