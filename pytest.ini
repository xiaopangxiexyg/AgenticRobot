[pytest]
# The remote Miniconda environment inherits a user-site Dash pytest plugin.
# Dash is not a DexTeleop test dependency, and that plugin imports optional
# packages absent from the isolated environment before collection begins.
addopts = -p no:dash --strict-markers
testpaths = tests
# Field-validation tools may intentionally use names ending in ``_test.py``.
# Restrict default discovery to pytest modules so importing the suite cannot
# load an operator tool merely because of its filename.
python_files = test_*.py
norecursedirs =
    deployments/openpi/src
    .git
    .cache
    build
    dist
markers =
    unit: deterministic in-process behavior test; default tier for unclassified project tests.
    slow_sim: measured long-running deterministic simulation, IK replay, repository-wide source scan, physical closed-loop, or high-volume soak verification; legacy marker name retained for selector compatibility.
    contract: public schema, action, dataset, or dependency-boundary contract test.
    integration: multi-component, filesystem, worker, or writer integration test.
    optional: requires an optional runtime dependency (for example MuJoCo, OpenCV, Torch, or OpenPI).
    hardware: requires a real device, SDK service, or operator-provided hardware environment; never run by default.
