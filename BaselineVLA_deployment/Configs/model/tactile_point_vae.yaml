name: Tactile_Point_VAE
family: point_vae
activation: gelu
dropout: 0.0
latent_dim: 32
target_feature_dim: 4
# The VAE input preset appends valid_mask as the 5th per-point feature.
# Reconstruction still targets only (x, y, z, value).
valid_feature_index: 4
encoder:
  type: pointnext_style
  width: 64
  depth: 3
  k_neighbors: 16
decoder:
  type: pointnext_style_query
  query_dim: 64
  hidden_dims:
    - 128
    - 128
  refinement_blocks: 2
  k_neighbors: 16
loss:
  xyz_weight: 1.0
  value_weight: 1.0
  beta: 0.001
normalization:
  enabled: true
  # auto: wrist-local uses center=[0,0,0], scale=0.1m;
  # camera uses center=[0,0,0.5], scale=0.25m.
  xyz_center: auto
  xyz_scale: auto
  # Raw tactile values are 0-100+; scaling keeps value MSE comparable
  # to normalized xyz MSE without changing the source dataset.
  value_offset: 0.0
  value_scale: 32.0
