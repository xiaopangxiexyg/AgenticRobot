name: Basic_VLA
family: vla
activation: gelu
dropout: 0.0
token_dim: 128
vision_token_dim: 4
use_vision_tokens: true
med_branch:
  projector:
    type: auto
  predictor:
    type: auto
  pointnet_hidden_dims:
    - 64
    - 128
  point_query_dim: 128
task:
  enabled: false
  t5_model_path: ThirdParty/t5-base
  max_text_tokens: 32
  text_projection_hidden_dims: []
state_encoder_hidden_dims:
  - 128
  - 128
vision_encoder_hidden_dims:
  - 64
tactile:
  enabled: true
  projector_hidden_dims:
    - 128
num_attention_heads: 4
observation_transformer_layers: 2
policy_transformer_layers: 2
transformer_ffn_dim: 256
action_decoder_hidden_dims:
  - 128
  - 64
