[project]
name = "agenticrobot-robosuite-runtime"
version = "0.1.0"
description = "Isolated headless robosuite runtime for AgenticRobot simulation experiments"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mujoco==3.9.0",
    "numpy==1.26.4",
    "robosuite==1.5.2",
    "scipy==1.13.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false
