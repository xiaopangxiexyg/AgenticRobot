name: lab-control

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out parent source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install bounded verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 ruff==0.16.2 mypy==1.11.2

      - name: Validate framework boundaries
        run: >-
          python -m lab_control.framework_boundary
          --root .
          --policy integration/policies/lab-framework-boundaries.json

      - name: Run lab tests
        run: python -m pytest -q tests/test_lab_*.py

      - name: Run static checks
        run: |
          ruff check lab_control tests/test_lab_*.py
          mypy lab_control
          ./dev doctor
          git diff --check
