server:
  host: 0.0.0.0
  port: 8444
  https: true
  cert: assets/certs/quest_dev.crt
  key: assets/certs/quest_dev.key
  max_ws_clients: 4
  auth_timeout_s: 5.0
  pairing:
    enabled: true
    # 每次启动默认生成新的 6 位数字；也可通过下列环境变量注入固定 6 位数字。
    token_env: QUEST_DEV_PAIRING_TOKEN
    require_same_origin: true

xr:
  reference_space: local-floor

features:
  visualization:
    enabled: true
    client:
      show_robot_tcp_axes: true
      show_robot_base_axes: true
      show_robot_tcp_marker: true
      axis_length_m: 0.18
      show_controller_axes: true
      show_reference_marker: true
      reference_marker_size_m: 0.10
      reference_marker_forward_m: 0.8
      reference_marker_down_from_viewer_m: 0.15
    # 可选的 RealMan RM65 真机只读反馈。默认关闭；启用后直接调用
    # RM65ArmBackend 的 observation_only 状态读取，不发送动作或控制指令。
    robot_feedback:
      enabled: false
      rate_hz: 30
      max_age_s: 0.25
      realman:
        # 可选：使用项目现有的 RM65 IP assignment；也可在每个 arm 下
        # 写 arm_ip，或通过 QUEST_REALMAN_LEFT_IP/RIGHT_IP 注入。
        ip_assignment: latest
        control_domain_id: quest-dev:realman-rm65-observation
        arms:
          rm65_left:
            enabled: false
            side: left
            arm_ip: ""
          rm65_right:
            enabled: false
            side: right
            arm_ip: ""
      # Reviewed bindings are intentionally absent by default. Without one,
      # robot_tcp remains diagnostic-only and the browser draws no TCP axes.
      frame_bindings: {}
      # Paths are resolved relative to hardware/quest_dev when not absolute.
      # A loaded file must be the canonical accepted_frame_binding.v1 payload.
      frame_binding_paths: {}
  controller_pose:
    enabled: true
    client:
      publish_rate_hz: 20
    admission:
      max_rate_hz: 40
      max_controllers: 2
